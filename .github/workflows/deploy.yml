name: Deploy Trainer App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Sync code into the live app folder
        run: |
          rsync -a --exclude='.git' --exclude='venv' --exclude='.env' ./ /home/runner-svc/seniorProj/

      - name: Install dependencies
        run: |
          source /home/runner-svc/seniorProj/venv/bin/activate
          pip install -r /home/runner-svc/seniorProj/requirements.txt

      - name: Restart the app service
        run: sudo systemctl restart trainer-app